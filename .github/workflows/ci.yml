name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages (Conventional Commits, no co-author)
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg || { echo "::error::commit $sha"; exit 1; }
          done

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Four workers (a public repo's runner has 4 vCPUs), each with its own Postgres container;
      # a file stays on one worker, so its module-scoped fixtures are built once.
      - run: uv run pytest --cov --cov-report=term-missing -n 4 --dist loadfile
      - name: Lint ops scripts
        run: uv run ruff format --check --config pyproject.toml ../ops && uv run ruff check --config pyproject.toml ../ops && uv run mypy --strict ../ops/backup/backup.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-client:
    # The TS client is generated from the backend schema: fail if a change forgot `make openapi`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: make openapi
      - name: Generated client is up to date
        run: |
          git add -N frontend
          git diff --exit-code -- frontend/openapi.json frontend/src/api/generated \
            || { echo "::error::Run 'make openapi' and commit the result."; exit 1; }

  docker:
    # Alongside the tests rather than after them: the images build in about a minute and a half.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build backend && docker build frontend && docker build ops/backup
