name: kwak

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      # Trust X-Forwarded-For from Caddy, so login limits see the real client address.
      # Safe because the api port is not published: only Caddy can reach it.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: ./ops/backup
    env_file: .env
    environment:
      KWAK_BACKUP_DIR: /backups
      TZ: ${TZ:-Europe/Paris}
    # Your user, so the backup files are yours on the host (not root's).
    user: "${KWAK_UID:-1000}:${KWAK_GID:-1000}"
    volumes:
      # Create the directory first (mkdir -p data/backups), or Docker creates it as root.
      - ${KWAK_BACKUP_DIR:-./data/backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    env_file: .env
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
