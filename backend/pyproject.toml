[project]
name = "kwak-finance"
version = "0.0.0"
description = "Kwak Finance backend workspace"
requires-python = ">=3.13,<3.14"
dependencies = ["kwak-core", "kwak-api", "kwak-analytics"]

[project.optional-dependencies]
foundation = ["kwak-analytics[foundation]"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.140",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kwak-core = { workspace = true }
kwak-api = { workspace = true }
kwak-analytics = { workspace = true }
# PyTorch for the processor only: the CUDA build would add gigabytes the server cannot use.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PT", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# User-visible strings keep their typography (en dashes), as the frontend's i18n files.
"packages/api/src/kwak_api/dash/i18n.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["kwak_core", "kwak_api", "kwak_analytics"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Plotly ships no type hints; only the Dash pages use it. Nor does pandas, which only the
# forecasting engine uses, to talk to Nixtla's libraries.
module = ["plotly.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The forecast's optional foundation models (F-FCT-7): untyped, and absent without the extra.
module = ["chronos.*", "timesfm.*", "torch.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.alembic]
script_location = "kwak_api:migrations"
