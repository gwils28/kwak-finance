[project]
name = "kwak-analytics"
version = "0.0.0"
description = "Kwak Finance analytics, forecasting and simulation (phase 5)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kwak-core",
    "numpy>=2.3",
]

[tool.uv.sources]
kwak-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
